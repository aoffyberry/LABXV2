name: Insights sync

on:
  schedule:
    - cron: '17 20 * * *'   # every day 03:17 Asia/Bangkok
  workflow_dispatch:
    inputs:
      periods:
        description: 'Periods to fetch (comma list, e.g. 2026-09-H1,2026-09-M). Empty = auto (last MONTHS months)'
        required: false
        default: ''
      months:
        description: 'Months back to check when periods is empty'
        required: false
        default: '3'
      force:
        description: 'Re-fetch frozen periods too'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: insights-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Graph API → encrypted snapshots
        env:
          FB_GRAPH_TOKEN: ${{ secrets.FB_GRAPH_TOKEN }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v24.0' }}
          PAGE_MATCH: ${{ vars.PAGE_MATCH }}
          PERIODS: ${{ inputs.periods }}
          MONTHS: ${{ inputs.months || '3' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node scripts/sync-insights.mjs
      - name: Commit snapshots
        run: |
          git config user.name "insights-sync[bot]"
          git config user.email "insights-sync@users.noreply.github.com"
          git add insights-dashboard/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update insights snapshots $(date -u +%Y-%m-%d)"
          git push
